name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIEDA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: CLI pipeline (ERC → simulation → place & route → DRC → fabrication files)
        run: |
          mkdir -p fab
          ./build/sieda-cli --demo fab
      - name: Local runner script (run.sh)
        run: |
          bash -n run.sh
          ./run.sh help
          ./run.sh doctor
          ./run.sh demo runner-demo
          test -s runner-demo/verification_report.md
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: demo-fabrication-files
          path: fab/

  sanitizers:
    name: Core sanitizers and fuzzing (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer and libFuzzer runtimes
        run: sudo apt-get install -y -q "libclang-rt-$(clang --version | grep -oP 'version \K[0-9]+')-dev"
      - name: Configure (AddressSanitizer, UndefinedBehaviorSanitizer, libFuzzer)
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DSIEDA_FUZZ=ON
      - name: Build
        run: cmake --build build-san --parallel
      - name: Unit tests under ASan, UBSan and LeakSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # The scale budget times the router; sanitizers make every run several times slower.
        run: ctest --test-dir build-san --output-on-failure -E sieda_scale_budget
      - name: Fuzz the file readers (60 s each)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./build-san/sieda-cli --demo seeds >/dev/null
          for t in json project spice library idf; do mkdir -p corpus/$t; done
          cp seeds/design.siedaproj corpus/json/ && cp seeds/design.siedaproj corpus/project/
          cp seeds/*-netlist.cir corpus/spice/
          i=0
          for f in Core/tests/fixtures/library/*.kicad_mod Core/tests/fixtures/library/*.kicad_sym \
                   Core/tests/fixtures/library/*.lbr Core/tests/fixtures/altium/*; do
            case "$f" in *.kicad_mod) b='\000';; *.kicad_sym) b='\001';; *.lbr) b='\002';; *.SchLib) b='\003';;
                         *.PcbLib) b='\004';; *.IntLib) b='\005';; *) continue;; esac
            { printf "$b"; cat "$f"; } > corpus/library/seed$((i += 1))
          done
          for t in json project spice library idf; do
            ./build-san/sieda_fuzz_$t corpus/$t -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -max_len=262144 \
              -print_final_stats=1 || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*
            oom-*

  app:
    name: macOS app (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project is up to date
        run: |
          python3 tools/generate_xcodeproj.py
          git diff --exit-code -- SiEDA.xcodeproj
      - name: Interface translations are complete
        run: |
          python3 tools/check_localization.py
          for f in SiEDA/Resources/*.lproj/Localizable.strings; do plutil -lint "$f" >/dev/null || exit 1; done
      - name: Local runner builds the app (./run.sh build)
        run: |
          ./run.sh build
          test -x build-app/Build/Products/Debug/SiEDA.app/Contents/MacOS/SiEDA
      - name: Build and test
        run: |
          set -o pipefail
          : > xcodebuild.log
          # If the live-window test reports a hang, sample the stuck app so the log shows where the main thread is.
          ( while sleep 2; do
              if grep -q "\[LiveWindow\] HUNG" xcodebuild.log 2>/dev/null; then
                pid=$(pgrep -x SiEDA | head -1)
                [ -n "$pid" ] && sample "$pid" 4 -mayDie -file hang-sample.txt >/dev/null 2>&1
                break
              fi
            done ) &
          xcodebuild -project SiEDA.xcodeproj -scheme SiEDA -configuration Debug \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY=- \
            SWIFT_COMPILATION_MODE=wholemodule \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            test 2>&1 | tee xcodebuild.log
      - name: Report compiler and test errors
        if: failure()
        run: |
          # Surface the first errors as annotations (readable from the PR checks UI and the API).
          grep -E "(error|fatal error): |error: -\[|XCTAssert|Test Case .* failed|\*\* (BUILD|TEST) FAILED" xcodebuild.log \
            | sed -E "s#^$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 xcodebuild.log > errors.txt
          # GitHub keeps at most 10 error annotations per step: pack 6 lines into each (%0A = newline).
          # (Whole-module compilation above makes the compiler report every type error in one run.)
          awk '{ gsub(/%/, "%25"); buf = buf $0 "%0A"; if (NR % 6 == 0) { print "::error title=xcodebuild::" buf; buf = "" } }
               END { if (buf != "") print "::error title=xcodebuild::" buf }' errors.txt
      - name: Main-thread sample of a hang
        if: failure()
        run: |
          [ -f hang-sample.txt ] || { echo "No hang sample."; exit 0; }
          # The main thread's call tree (heaviest path first), then the most frequent top-of-stack frames.
          awk '/^Call graph:/{on=1} on' hang-sample.txt | head -220
          awk '/^Sort by top of stack/{on=1} on' hang-sample.txt | head -40
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            hang-sample.txt

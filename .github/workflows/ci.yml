name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIEDA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: CLI pipeline (ERC → simulation → place & route → DRC → fabrication files)
        run: |
          mkdir -p fab
          ./build/sieda-cli --demo fab
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: demo-fabrication-files
          path: fab/

  app:
    name: macOS app (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode project is up to date
        run: |
          python3 tools/generate_xcodeproj.py
          git diff --exit-code -- SiEDA.xcodeproj
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project SiEDA.xcodeproj -scheme SiEDA -configuration Debug \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY=- test 2>&1 | tee xcodebuild.log
      - name: Report compiler and test errors
        if: failure()
        run: |
          # Surface the first errors as annotations (readable from the PR checks UI and the API).
          grep -E "(error|fatal error): |error: -\[|XCTAssert|Test Case .* failed|\*\* (BUILD|TEST) FAILED" xcodebuild.log \
            | sed -E "s#^$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -60 xcodebuild.log > errors.txt
          # GitHub keeps at most 10 error annotations per step: pack 6 lines into each (%0A = newline).
          awk '{ gsub(/%/, "%25"); buf = buf $0 "%0A"; if (NR % 6 == 0) { print "::error title=xcodebuild::" buf; buf = "" } }
               END { if (buf != "") print "::error title=xcodebuild::" buf }' errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
